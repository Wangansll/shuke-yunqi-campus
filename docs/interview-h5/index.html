<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>面试演练 · 数科云栖校园</title>
<style>
  :root {
    --blue: #1B54C4; --blue-2: #2B6FE8; --bg: #F5F7FB; --card: #fff;
    --tx: #0F1A33; --sub: #6B7789; --line: #E5EDFB; --warn: #B4761F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--tx); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .head { padding: 18px 4px 12px; }
  .head h1 { font-size: 20px; }
  .head p { font-size: 13px; color: var(--sub); margin-top: 6px; line-height: 1.6; }
  .card { background: var(--card); border-radius: 18px; padding: 18px; margin-top: 16px; box-shadow: 0 2px 10px rgba(30,60,120,.06); }
  .tracks { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .track { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #F7FAFF; }
  .track.on { border-color: var(--blue-2); background: #EDF3FE; }
  .track b { font-size: 15px; color: var(--blue); }
  .track span { display: block; font-size: 12.5px; color: var(--sub); margin-top: 5px; line-height: 1.6; }
  label { font-size: 14px; font-weight: 600; display: block; margin: 14px 0 8px; }
  textarea, input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; background: #F7FAFF; }
  textarea { min-height: 90px; resize: vertical; }
  .note { font-size: 12px; color: var(--sub); line-height: 1.7; margin-top: 12px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 24px; padding: 14px; font-size: 15px; font-weight: 700; color: #fff; background: linear-gradient(135deg,var(--blue-2),var(--blue)); margin-top: 16px; }
  .btn.ghost { background: #EDF3FE; color: var(--blue); }
  .btn:disabled { opacity: .5; }
  .msgs { display: flex; flex-direction: column; gap: 12px; margin-top: 14px; }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 80%; padding: 12px 14px; border-radius: 14px; font-size: 14px; line-height: 1.7; background: #F2F5FA; }
  .bubble.ai { background: #EDF3FE; }
  .msg.user .bubble { background: var(--blue-2); color: #fff; }
  .bar { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  .bar textarea { flex: 1; }
  .rec { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: #fff; font-size: 18px; }
  .rec.on { background: #FFECEC; border-color: #E85D5D; }
  .tag { display: inline-block; font-size: 11px; color: var(--warn); background: #FFF7E8; border-radius: 10px; padding: 3px 10px; margin-left: 8px; }
  .hidden { display: none; }
  .foot { font-size: 11.5px; color: #9AA4B2; line-height: 1.7; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>面试演练 <span class="tag">H5 演示</span></h1>
    <p>独立网页版，供浏览器打开。录音、摄像头为预留能力；未接入语音服务时使用文字作答。AI 反馈仅作练习参考，非官方录用结论。</p>
  </div>

  <!-- 准备 -->
  <section class="card" id="setup">
    <div class="tracks" id="tracks"></div>
    <label>简短背景（可选）</label>
    <textarea id="profile" maxlength="300" placeholder="专业、年级、一段相关经历…"></textarea>
    <button class="btn" id="startBtn">开始演练</button>
    <p class="note">本页面为课程作品演示，不读取真实简历，不承诺录用；岗位、批次、薪资以吉利官方公告为准。</p>
  </section>

  <!-- 答题 -->
  <section class="card hidden" id="chat">
    <div class="msgs" id="msgs"></div>
    <div class="bar">
      <button class="rec" id="recBtn" title="录音（预留）">🎙</button>
      <textarea id="answer" placeholder="输入你的回答…" rows="2"></textarea>
      <button class="btn ghost" id="sendBtn" style="width:auto;margin-top:0;padding:12px 18px;">发送</button>
    </div>
    <button class="btn ghost" id="finishBtn">结束并复盘</button>
  </section>

  <div class="foot">数科云栖校园 · 吉利专区 · 外跳 H5 版本</div>
</div>

<script>
// ===== 题库（与小程序侧一致，静态内置，便于纯离线演示） =====
const TRACKS = [
  { k: 'campus', n: '校园招聘', questions: [
    '请先做一个简短的自我介绍，包括专业、擅长方向和一段最能代表你的经历。',
    '为什么选择投递吉利？你对旗下哪个品牌或业务方向感兴趣？',
    '讲一段课程项目、实习或社团里遇到的困难，你是怎么解决的？',
  ]},
  { k: 'star', n: '繁星项目', questions: [
    '介绍你自己，以及为什么想参加繁星项目这类新零售培养。',
    '说说你对吉利银河、领克、极氪中某一个品牌的印象。',
    '遇到挑剔或暂时不下单的顾客，你会怎么应对？',
  ]},
  { k: 'social', n: '社会招聘', questions: [
    '介绍你的工作或项目经历，重点说一段有结果的事情。',
    '这段经历里你承担的具体职责是什么？可量化结果有哪些？',
    '你未来两三年的职业规划是什么？',
  ]},
];

// ===== 配置：后端代理地址；未配置时走本地静态演示，不直连大模型 =====
const CONFIG = {
  apiBase: '', // 例：https://your-domain.com/api/interview；留空为离线演示模式
  track: 'campus',
  qIndex: 0,
  history: [],
  mediaReady: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
};

const $ = id => document.getElementById(id);

function renderTracks() {
  $('tracks').innerHTML = TRACKS.map(t =>
    `<div class="track ${t.k===CONFIG.track?'on':''}" data-k="${t.k}"><b>${t.n}</b><span>${t.questions.length} 道演练题</span></div>`
  ).join('');
  document.querySelectorAll('.track').forEach(el => el.addEventListener('click', () => {
    CONFIG.track = el.dataset.k; renderTracks();
  }));
}

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble ${role==='assistant'?'ai':''}">${escapeHtml(text)}</div>`;
  $('msgs').appendChild(div);
  $('msgs').scrollTop = $('msgs').scrollHeight;
  return div;
}

function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function currentTrack() { return TRACKS.find(t => t.k === CONFIG.track) || TRACKS[0]; }

// 离线演示：轮流抛题 + 固定点评；接入后端后替换为 callModel()
function demoNext() {
  const t = currentTrack();
  if (CONFIG.qIndex < t.questions.length) {
    addMsg('assistant', t.questions[CONFIG.qIndex]);
  } else {
    addMsg('assistant', '本轮题目已结束，你可以点「结束并复盘」查看反馈。');
  }
}

async function callModel(messages) {
  if (!CONFIG.apiBase) return null; // 离线
  const r = await fetch(CONFIG.apiBase, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ track: CONFIG.track, history: CONFIG.history, messages })
  });
  if (!r.ok) throw new Error('api error');
  const data = await r.json();
  return data.reply || '';
}

async function onSend() {
  const text = $('answer').value.trim();
  if (!text) return;
  addMsg('user', text);
  CONFIG.history.push({ role: 'user', content: text });
  $('answer').value = '';

  let reply = null;
  try { reply = await callModel(CONFIG.history); } catch (e) { reply = null; }
  if (reply) {
    addMsg('assistant', reply);
    CONFIG.history.push({ role: 'assistant', content: reply });
  } else {
    CONFIG.qIndex += 1;
    setTimeout(demoNext, 300);
  }
}

function onFinish() {
  if (!CONFIG.apiBase) {
    addMsg('assistant', '复盘反馈（离线演示）：回答条理基本清晰；建议补充具体项目结果与数据；动机表达可再结合品牌与岗位。正式接入模型后此处生成个性化点评。');
    return;
  }
  callModel([...CONFIG.history, { role: 'user', content: '面试结束，请给出复盘反馈。' }])
    .then(r => r && addMsg('assistant', r))
    .catch(() => addMsg('assistant', '反馈生成失败，请重试。'));
}

// 录音预留：拿到权限后把音频交给后端 ASR；当前仅提示能力未接入
let recStream = null;
async function onRec() {
  if (!CONFIG.mediaReady) { alert('当前浏览器不支持录音能力'); return; }
  if (!recStream) {
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      $('recBtn').classList.add('on');
      alert('录音权限已获取；ASR 服务未接入，当前请用文字作答。');
    } catch (e) { alert('未获得麦克风权限'); }
  } else {
    recStream.getTracks().forEach(t => t.stop());
    recStream = null;
    $('recBtn').classList.remove('on');
  }
}

$('startBtn').addEventListener('click', () => {
  CONFIG.history = []; CONFIG.qIndex = 0;
  $('setup').classList.add('hidden'); $('chat').classList.remove('hidden');
  const profile = $('profile').value.trim();
  addMsg('assistant', '你好，我们开始本轮' + currentTrack().n + '演练。' + (profile ? '已了解你的背景：' + profile : '先从自我介绍开始吧。'));
  demoNext();
});
$('sendBtn').addEventListener('click', onSend);
$('finishBtn').addEventListener('click', onFinish);
$('recBtn').addEventListener('click', onRec);
$('answer').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } });

renderTracks();
</script>
</body>
</html>
